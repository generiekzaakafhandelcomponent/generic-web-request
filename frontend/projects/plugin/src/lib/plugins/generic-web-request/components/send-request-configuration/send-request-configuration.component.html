<p style="margin-bottom: 1.5rem">{{ 'actionDescription' | pluginTranslate: pluginId | async }}</p>

<v-form
  (valueChange)="formValueChange($event)"
  *ngIf="{
    disabled: disabled$ | async,
    prefill: prefillConfiguration$ ? (prefillConfiguration$ | async) : null
  } as obs"
>
  <v-select
    name="method"
    [items]="methodSelectItems"
    [title]="'method' | pluginTranslate: pluginId | async"
    [margin]="true"
    [disabled]="obs.disabled"
    [defaultSelectionId]="obs.prefill?.method ?? 'POST'"
    [required]="true"
  ></v-select>
  <v-input
    name="path"
    [title]="'path' | pluginTranslate: pluginId | async"
    [tooltip]="'pathTooltip' | pluginTranslate: pluginId | async"
    [margin]="true"
    [disabled]="obs.disabled"
    [defaultValue]="obs.prefill?.path"
    [trim]="true"
    placeholder="/notifications"
  >
  </v-input>
  <valtimo-carbon-multi-input
    name="headers"
    type="keyValue"
    [title]="'headers' | pluginTranslate: pluginId | async"
    [tooltip]="'headersTooltip' | pluginTranslate: pluginId | async"
    [keyColumnTitle]="'headerName' | pluginTranslate: pluginId | async"
    [valueColumnTitle]="'headerValue' | pluginTranslate: pluginId | async"
    [defaultValues]="obs.prefill?.headers"
    [disabled]="obs.disabled"
    [initialAmountOfRows]="0"
    [minimumAmountOfRows]="0"
    [fullWidth]="true"
    [margin]="true"
  ></valtimo-carbon-multi-input>
  <valtimo-carbon-multi-input
    name="body"
    type="keyValue"
    [title]="'body' | pluginTranslate: pluginId | async"
    [tooltip]="'bodyTooltip' | pluginTranslate: pluginId | async"
    [keyColumnTitle]="'fieldName' | pluginTranslate: pluginId | async"
    [valueColumnTitle]="'fieldValue' | pluginTranslate: pluginId | async"
    [defaultValues]="obs.prefill?.body"
    [disabled]="obs.disabled"
    [initialAmountOfRows]="0"
    [minimumAmountOfRows]="0"
    [fullWidth]="true"
    [margin]="true"
  ></valtimo-carbon-multi-input>
  <v-input
    name="resultVariable"
    [title]="'resultVariable' | pluginTranslate: pluginId | async"
    [tooltip]="'resultVariableTooltip' | pluginTranslate: pluginId | async"
    [margin]="true"
    [disabled]="obs.disabled"
    [defaultValue]="obs.prefill?.resultVariable"
    [trim]="true"
  >
  </v-input>
</v-form>
